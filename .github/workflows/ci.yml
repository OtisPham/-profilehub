name: ProfileHub Quality Gate CI

on:
  push:
    branches: [main, master, profilehub_v1, 1310-co-ban-chua-sua]
  pull_request:
    branches: [main, master, profilehub_v1]

jobs:
  quality-gate:
    name: TypeCheck, Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./profilehub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './profilehub/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 1 - Type Check (TypeScript Strict)
        run: npx tsc --noEmit

      - name: Gate 2 - Automated Vitest Suite (Unit & Integration)
        run: npx vitest run

      - name: Gate 3 - Production Build (Vite)
        run: npm run build
